[env:esp32-s3-devkitc-1-n32r16v]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; upload_port / monitor_port intentionally omitted — PlatformIO auto-detects
; the board. If you have multiple boards attached and need to pin a port,
; create a local platformio_override.ini (gitignored) instead of editing
; this file.
monitor_speed = 115200

board_build.arduino.memory_type = opi_opi
board_build.flash_mode          = opi
board_build.psram_type          = opi
board_upload.flash_size         = 32MB
board_upload.maximum_size       = 33554432
board_build.partitions          = default_32MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../shared

lib_deps =
    lovyan03/LovyanGFX @ 1.2.26
    igorantolic/Ai Esp32 Rotary Encoder @ 1.7.0
    Wire
    ; touch controller is physically present on the display module but not
    ; wired into the current design — kept here for a possible future use
    https://github.com/strange-v/FT6X36.git#v0.1.0